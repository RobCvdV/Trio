name: Build & Test (branch)
run-name: "Build & Test (${{ inputs.pr_number && format('PR #{0}', inputs.pr_number) || github.ref_name }})"

# Compile check + unit tests + code coverage for a feature branch, without
# signing, archiving or uploading to TestFlight.
#
# - On pushes to claude/** branches it only runs when the head commit message
#   contains "[build]", so it costs no runner minutes unless asked for.
# - Can be started by hand for any branch: Actions > "Build & Test (branch)" >
#   Run workflow, then pick the branch in "Use workflow from".
# - Can be started by hand for a pull request: fill in "Pull request number".
#   It then builds the PR merged into its base branch (what would land), compares
#   coverage against that base, and reports the result on the PR as a
#   "Build & Test" status check linking to this run.
# - With "Deploy to TestFlight" ticked (PR runs only), a passing build is then
#   built for release and uploaded to TestFlight, with the PR title and
#   description as the "What to Test" notes, and a "TestFlight" status on the PR
#   naming the build number.
#
# Results are in the run's Summary: build errors, failing tests, and a coverage
# table (per target, and per changed file compared to the base branch).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to build (leave empty to build the branch selected above)"
        type: string
        default: ""
      run_tests:
        description: "Run the unit tests (off = build only)"
        type: boolean
        default: true
      testflight:
        description: "Deploy to TestFlight after a passing build (needs a pull request number)"
        type: boolean
        default: false
      base_branch:
        description: "Branch to compare against for 'changed files' coverage (empty: the PR's base, or rob/main)"
        type: string
        default: ""
  push:
    branches:
      - "claude/**"
    paths-ignore:
      - "**.md"
      - "**/README"
      - "**.txt"
      - "**.xcstrings"

# A push without "[build]" must not cancel a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write # to report the result on a pull request

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 90
    # Opt-in on push: macOS runner minutes are limited, so only build when asked.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      head_sha: ${{ steps.target.outputs.head_sha }}

    env:
      DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=26.2"
      RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
      PR_NUMBER: ${{ inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # For a PR: build its merge with the base branch (falls back to the PR head
      # when GitHub has no merge commit, e.g. on conflicts) and mark it pending.
      - name: Resolve what to build
        id: target
        env:
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            case "$PR_NUMBER" in
              *[!0-9]*) echo "::error::Pull request number must be a number, got '$PR_NUMBER'"; exit 1 ;;
            esac
            # GitHub computes mergeability lazily; ask a few times before giving up on the merge ref.
            for attempt in 1 2 3 4 5; do
              PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
              MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
              [ "$MERGEABLE" != "null" ] && break
              sleep 3
            done
            HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            BASE=$(echo "$PR_JSON" | jq -r '.base.ref')
            if [ "$MERGEABLE" = "true" ]; then
              REF="refs/pull/$PR_NUMBER/merge"
              WHAT="PR #$PR_NUMBER merged into $BASE"
            else
              REF="$HEAD_SHA"
              WHAT="PR #$PR_NUMBER head (no clean merge with $BASE: mergeable=$MERGEABLE)"
            fi
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=pending -f context="Build & Test" \
              -f description="Building and testing…" -f target_url="$RUN_URL" > /dev/null
          else
            REF="$GITHUB_SHA"
            BASE=""
            WHAT="$GITHUB_REF_NAME @ ${GITHUB_SHA:0:8}"
          fi
          COMPARE="${INPUT_BASE_BRANCH:-${BASE:-rob/main}}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "BASE_BRANCH=$COMPARE" >> "$GITHUB_ENV"
          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
          echo "Building: $WHAT (coverage compared to $COMPARE)"
          echo "### Building $WHAT" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1
          submodules: recursive

      # DerivedData lives outside the checkout on purpose: the SwiftFormat build
      # phase formats ${SRCROOT}, so build state inside it would get formatted.
      - name: Restore DerivedData
        id: dd-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-branch-dd-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-branch-dd-${{ hashFiles('**/Package.resolved') }}-
            ${{ runner.os }}-branch-dd-
            ${{ runner.os }}-dd-

      - name: Cache BuildTools (SwiftFormat)
        uses: actions/cache@v5
        with:
          path: BuildTools/.build
          key: ${{ runner.os }}-buildtools-${{ hashFiles('BuildTools/Package.swift', 'BuildTools/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-buildtools-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"

      - name: Report build result
        if: always()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild-build.log"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "## ✅ Build succeeded" >> "$GITHUB_STEP_SUMMARY"
            WARNINGS=$(grep -E "^/.*: warning:" "$LOG" 2>/dev/null | sed "s|$GITHUB_WORKSPACE/||" | sort -u | grep -v "/Dependencies/\|/SourcePackages/" || true)
            if [ -n "$WARNINGS" ]; then
              {
                echo ""
                echo "<details><summary>Warnings in app sources ($(echo "$WARNINGS" | wc -l | tr -d ' '))</summary>"
                echo ""
                echo '```'
                echo "$WARNINGS" | head -n 100
                echo '```'
                echo "</details>"
              } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## ❌ Build failed"
              echo ""
              echo '```'
              grep -E "error:|Undefined symbol|PhaseScriptExecution failed|The following build commands failed|BUILD FAILED" "$LOG" 2>/dev/null \
                | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -n 80 \
                || echo "(no error lines found, see the xcodebuild-build-log artifact)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # Inline annotations on the offending lines
            grep -E "^/.*:[0-9]+:[0-9]+: error:" "$LOG" 2>/dev/null | sort -u | head -n 50 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||")
              lineno=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
              echo "::error file=$file,line=$lineno::$msg"
            done
          fi

      - name: Upload build log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build-log
          path: ${{ runner.temp }}/xcodebuild-build.log
          if-no-files-found: ignore

      - name: Trim DerivedData before caching
        if: always() && steps.build.outcome == 'success'
        run: |
          DD="$HOME/Library/Developer/Xcode/DerivedData"
          find "$DD" -type d -name 'Logs' -prune -exec rm -rf {} + 2>/dev/null || true
          find "$DD" -name '*.xcactivitylog' -delete 2>/dev/null || true
          find "$DD" -type d -name 'Index.noindex' -prune -exec rm -rf {} + 2>/dev/null || true

      # Save only when nothing from this branch's cache line was restored, so a
      # branch stores one warm DerivedData instead of one per commit (the
      # repository cache limit is 10 GB and DerivedData is several GB).
      - name: Save DerivedData
        if: always() && steps.build.outcome == 'success' && !startsWith(steps.dd-restore.outputs.cache-matched-key, format('{0}-branch-dd-', runner.os))
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-branch-dd-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}

      - name: Run tests
        id: run_tests
        if: env.RUN_TESTS == 'true'
        run: |
          set -o pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test-without-building \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report test results
        if: always() && steps.run_tests.outcome != 'skipped' && steps.build.outcome == 'success'
        run: |
          LOG="$RUNNER_TEMP/xcodebuild-test.log"
          # Swift Testing prints a final "Test run with N tests in M suites passed/failed ..." line;
          # XCTest prints "Executed N tests, with M failures".
          SWIFT_TESTING=$(grep -E "Test run with [0-9]+ tests" "$LOG" 2>/dev/null | tail -n 1 | sed -E 's/^[^ ]+ //' || true)
          XCTEST=$(grep -E "Executed [0-9]+ tests?, with [0-9]+ failures?" "$LOG" 2>/dev/null | tail -n 1 | sed -E 's/^.*(Executed)/\1/' || true)
          echo "Swift Testing: ${SWIFT_TESTING:-n/a}"
          echo "XCTest: ${XCTEST:-n/a}"
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            {
              echo "## ✅ Tests passed"
              echo ""
              echo "- Swift Testing: ${SWIFT_TESTING:-n/a}"
              echo "- XCTest: ${XCTEST:-n/a}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ Tests failed"
              echo ""
              echo "- Swift Testing: ${SWIFT_TESTING:-n/a}"
              echo "- XCTest: ${XCTEST:-n/a}"
              echo ""
              echo '```'
              # Swift Testing issues (✘ ... recorded an issue at File.swift:line: ...) and XCTest failures
              grep -E "✘ Test .*recorded an issue|✘ Test .*failed|error: -\[.*\] : |Fatal error|Testing failed:|could not be launched|Restarting after unexpected exit" "$LOG" 2>/dev/null \
                | grep -v "36;1m" | sed -E 's/^[0-9T:.-]+Z //' | sed "s|$GITHUB_WORKSPACE/||" | head -n 80 \
                || echo "(no failure lines found, see the test-results artifact)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # Inline annotations for Swift Testing issues
            grep -oE "recorded an issue at [A-Za-z0-9_+]+\.swift:[0-9]+:[0-9]+: .*" "$LOG" 2>/dev/null | head -n 30 | while IFS= read -r line; do
              file=$(echo "$line" | sed -E 's/recorded an issue at ([^:]+):.*/\1/')
              lineno=$(echo "$line" | sed -E 's/recorded an issue at [^:]+:([0-9]+):.*/\1/')
              msg=$(echo "$line" | sed -E 's/recorded an issue at [^:]+:[0-9]+:[0-9]+: //')
              path=$(git ls-files "*/$file" "$file" | head -n 1)
              echo "::error file=${path:-$file},line=$lineno::$msg"
            done
          fi

      - name: Code coverage
        if: always() && steps.run_tests.outcome != 'skipped' && steps.build.outcome == 'success'
        run: |
          RESULT_BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "No result bundle, skipping coverage." ; exit 0
          fi
          xcrun xccov view --report --json "$RESULT_BUNDLE" > "$RUNNER_TEMP/coverage.json" || { echo "xccov failed"; exit 0; }

          # Swift files changed on this branch compared to the base branch
          # The checkout is shallow: deepen both sides enough to find the merge base
          git fetch --no-tags --depth=300 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" >/dev/null 2>&1 || true
          git fetch --no-tags --deepen=300 origin "$CHECKOUT_REF" >/dev/null 2>&1 || true
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_BRANCH" 2>/dev/null || true)
          if [ -n "$MERGE_BASE" ]; then
            git diff --name-only --diff-filter=AM "$MERGE_BASE" HEAD -- '*.swift' > "$RUNNER_TEMP/changed-files.txt"
          else
            : > "$RUNNER_TEMP/changed-files.txt"
          fi

          # Written to the run summary AND the job log (the log is readable through the API)
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/changed-files.txt" "$BASE_BRANCH" \
            > "$RUNNER_TEMP/coverage-summary.md" <<'PY'
          import json, os, sys
          workspace, cov_path, changed_path, base = sys.argv[1:5]
          report = json.load(open(cov_path))
          changed = [l.strip() for l in open(changed_path) if l.strip()]

          def pct(x):
              return f"{x * 100:.1f}%"

          print("## 📊 Code coverage")
          print()
          print("| Target | Lines covered | Coverage |")
          print("| --- | ---: | ---: |")
          files = {}
          for t in sorted(report.get("targets", []), key=lambda t: t["name"]):
              if t.get("executableLines", 0) == 0 or t["name"].endswith(".xctest"):
                  continue
              print(f"| {t['name']} | {t['coveredLines']}/{t['executableLines']} | {pct(t['lineCoverage'])} |")
              for f in t.get("files", []):
                  rel = os.path.relpath(f["path"], workspace) if f["path"].startswith(workspace) else f["path"]
                  files[rel] = f
          print()
          print(f"### Changed files (vs `{base}`)")
          print()
          if not changed:
              print("_No changed Swift files found._")
          else:
              print("| File | Lines covered | Coverage |")
              print("| --- | ---: | ---: |")
              for path in changed:
                  f = files.get(path)
                  if f is None:
                      print(f"| `{path}` | — | not in report |")
                  else:
                      print(f"| `{path}` | {f['coveredLines']}/{f['executableLines']} | {pct(f['lineCoverage'])} |")

          # Per function, so logic coverage is visible next to (untestable) SwiftUI view bodies
          detail = []
          for path in changed:
              f = files.get(path)
              if not f or not f.get("functions"):
                  continue
              detail.append(f"#### `{path}`")
              detail.append("")
              detail.append("| Function | Lines covered | Coverage |")
              detail.append("| --- | ---: | ---: |")
              for fn in sorted(f["functions"], key=lambda fn: fn.get("lineNumber", 0)):
                  if fn.get("executableLines", 0) == 0:
                      continue
                  name = fn["name"].replace("|", "\\|")
                  detail.append(f"| `{name}` (line {fn.get('lineNumber', '?')}) | {fn['coveredLines']}/{fn['executableLines']} | {pct(fn['lineCoverage'])} |")
              detail.append("")
          if detail:
              print()
              print("<details><summary>Coverage per function in changed files</summary>")
              print()
              print("\n".join(detail))
              print("</details>")
          PY
          cat "$RUNNER_TEMP/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/coverage-summary.md"

      - name: Upload test log and coverage
        if: always() && steps.run_tests.outcome != 'skipped' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/coverage.json
          if-no-files-found: ignore

      - name: Report result on the pull request
        if: always() && steps.target.outputs.head_sha != ''
        run: |
          case "${{ job.status }}" in
            success) STATE=success; DESC="Build and tests passed" ;;
            cancelled) STATE=error; DESC="Run was cancelled" ;;
            *)
              STATE=failure
              if [ "${{ steps.build.outcome }}" != "success" ]; then DESC="Build failed"; else DESC="Tests failed"; fi
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.target.outputs.head_sha }}" \
            -f state="$STATE" -f context="Build & Test" \
            -f description="$DESC" -f target_url="$RUN_URL" > /dev/null
          echo "Reported '$STATE' on PR #$PR_NUMBER"

  # Release build of the same pull request, uploaded to TestFlight. Mirrors the
  # build job of "4. Build Trio" (patches, signing, fastlane) but never syncs or
  # pushes anything, and only runs when the build and tests above passed.
  testflight:
    name: TestFlight
    needs: build-and-test
    if: inputs.testflight && inputs.pr_number != '' && needs.build-and-test.result == 'success'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ needs.build-and-test.outputs.head_sha }}
      BUILD_REF: ${{ needs.build-and-test.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark TestFlight build as pending on the pull request
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context="TestFlight" \
            -f description="Building for TestFlight…" -f target_url="$RUN_URL" > /dev/null

      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer"

      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          ref: ${{ needs.build-and-test.outputs.ref }}

      # Same customizations as "4. Build Trio"
      - name: Customize Trio
        run: |
          if $(ls ./patches/* &> /dev/null); then
          git apply ./patches/* --allow-empty -v --whitespace=fix
          fi

      - name: Configure Dev Branch Warning
        if: vars.DEV_BRANCH_WARNING_DISABLED == 'true'
        run: |
          echo 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) DEV_BRANCH_WARNING_DISABLED' >> ConfigOverride.xcconfig

      # "What to Test" notes: PR title, link and description, so the build is recognizable in TestFlight.
      - name: Write TestFlight notes from the pull request
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$BUILD_REF" > "$RUNNER_TEMP/notes.txt" <<'PY'
          import json, re, sys
          from datetime import datetime, timezone
          pr = json.load(open(sys.argv[1]))
          build_ref = sys.argv[2]
          what = (f"{pr['head']['ref']} merged into {pr['base']['ref']}" if build_ref.endswith("/merge")
                  else f"{pr['head']['ref']} (not merged with {pr['base']['ref']})")
          body = pr.get("body") or ""
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)          # template comments
          body = re.sub(r"https://claude\.ai/code/session_\S+", "", body)  # session links
          body = re.sub(r"\n{3,}", "\n\n", body).strip()
          header = "\n".join([
              f"🧪 PR #{pr['number']}: {pr['title']}",
              pr["html_url"],
              f"Build of {what} @ {pr['head']['sha'][:8]}",
              f"Built {datetime.now(timezone.utc):%Y-%m-%d %H:%M} UTC",
          ])
          notes = header + ("\n\n" + body if body else "")
          if len(notes) > 4000:
              notes = notes[:3990].rstrip() + "\n…"
          print(notes)
          PY
          {
            echo "TESTFLIGHT_CHANGELOG<<TESTFLIGHT_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.txt"
            echo "TESTFLIGHT_NOTES_EOF"
          } >> "$GITHUB_ENV"
          echo "### TestFlight notes" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat "$RUNNER_TEMP/notes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_trio
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Report TestFlight build on the pull request
        if: always()
        run: |
          VERSION=$(grep -E '^APP_VERSION *=' Config.xcconfig 2>/dev/null | sed -E 's/.*= *//' || true)
          BUILD="${VERSION:-?} (${TESTFLIGHT_BUILD_NUMBER:-?})"
          case "${{ job.status }}" in
            success) STATE=success; DESC="Uploaded as build $BUILD" ;;
            cancelled) STATE=error; DESC="Cancelled" ;;
            *) STATE=failure; DESC="TestFlight build or upload failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="TestFlight" \
            -f description="$DESC" -f target_url="$RUN_URL" > /dev/null
          echo "## TestFlight: $DESC" >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight: $DESC"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-log
          path: buildlog
          if-no-files-found: ignore
